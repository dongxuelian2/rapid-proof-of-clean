[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rapid-proof-of-clean"
version = "0.1.0"
description = "Research workspace for the Rapid Proof of Clean innovation challenge."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.9,<4",
    "numpy>=2.0,<3",
    "pandas>=2.2,<3",
    "pydantic>=2.7,<3",
    "rich>=13.7,<14",
    "scipy>=1.13,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "ruff>=0.6,<1",
]
notebook = [
    "jupyterlab>=4.0,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]
exclude = ["proof_clean_local_plan"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
